services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: free-social-media-automation

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./models:/app/models
      - ./secrets:/app/secrets

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
