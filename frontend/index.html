<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Social Automation</title><style>
body{font-family:system-ui;margin:0;background:#0b0d10;color:#eee}main{max-width:1100px;margin:auto;padding:20px}.card{background:#15191f;border:1px solid #2a3038;border-radius:16px;padding:18px;margin:14px 0}h1{margin-bottom:4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,textarea,select,button{font:inherit;width:100%;box-sizing:border-box;margin:5px 0;padding:11px;border-radius:9px;border:1px solid #39414c;background:#0d1014;color:#fff}textarea{min-height:100px}button{cursor:pointer;background:#2563eb;border:0}.muted{color:#9ca3af}.row{display:flex;gap:8px}.row>*{flex:1}pre{white-space:pre-wrap;overflow:auto;max-height:320px}.job{padding:10px;border:1px solid #303640;border-radius:10px;margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{flex-direction:column}}
</style></head><body><main><h1>Free Social Automation</h1><div class="muted">Private • local AI • official platform APIs • no billing system</div>
<div class="card"><h2>1. Upload media</h2><input id="file" type="file" accept="video/*,image/*"><button onclick="upload()">Upload</button><pre id="uploadResult"></pre></div>
<div class="card"><h2>2. Content</h2><div class="grid"><input id="mediaId" type="number" placeholder="Media ID"><input id="target" value="en" placeholder="Target language"></div><input id="title" placeholder="Title"><textarea id="description" placeholder="Description"></textarea><input id="hashtags" placeholder="#hashtags"><input id="keywords" placeholder="keywords"><button onclick="createContent()">Save Draft</button><pre id="contentResult"></pre></div>
<div class="card"><h2>3. AI metadata + captions</h2><div class="row"><input id="contentId" type="number" placeholder="Content ID"><select id="platform"><option>general</option><option>facebook</option><option>youtube</option><option>tiktok</option></select></div><button onclick="generate()">Generate Transcript + AI Metadata + Word Captions</button><pre id="aiResult"></pre></div>
<div class="card"><h2>4. Translation</h2><div class="row"><input id="translateId" type="number" placeholder="Content ID"><select id="lang"><option value="en">English</option><option value="ur">Urdu</option></select></div><button onclick="translateText()">Translate</button><pre id="translationResult"></pre></div>
<div class="card"><h2>5. Voice-over</h2><div class="row"><input id="voiceContent" type="number" placeholder="Content ID"><select id="voice"><option value="">Default voice</option></select></div><textarea id="voiceText" placeholder="Use translated text or custom script"></textarea><button onclick="makeVoice()">Generate Voice-over</button><pre id="voiceResult"></pre></div>
<div class="card"><h2>6. Render</h2><div class="grid"><input id="renderContent" type="number" placeholder="Content ID"><select id="burn"><option value="false">No burned subtitles</option><option value="true">Burn subtitles</option></select></div><button onclick="render()">Create Final Video</button><pre id="renderResult"></pre></div>
<div class="card"><h2>7. Schedule / Queue</h2><div class="grid"><input id="scheduleContent" type="number" placeholder="Content ID"><select id="schedulePlatform"><option>facebook</option><option>youtube</option><option>tiktok</option></select><input id="scheduleTime" type="datetime-local"><input id="attempts" type="number" value="3" min="1" max="10"></div><button onclick="schedule()">Schedule</button><pre id="scheduleResult"></pre></div>
<div class="card"><h2>8. Publishing history</h2><button onclick="loadJobs()">Refresh Jobs</button><div id="jobs"></div></div>
<script>
const $=id=>document.getElementById(id); async function req(url,opt){const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.detail||JSON.stringify(d));return d}
async function upload(){try{const f=$('file').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);const d=await req('/api/media',{method:'POST',body:fd});$('mediaId').value=d.id;$('uploadResult').textContent=JSON.stringify(d,null,2)}catch(e){$('uploadResult').textContent=e}}
async function createContent(){try{const d=await req('/api/content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({media_id:Number($('mediaId').value)||null,title:$('title').value,description:$('description').value,hashtags:$('hashtags').value,keywords:$('keywords').value,target_language:$('target').value||'en'})});['contentId','translateId','voiceContent','renderContent','scheduleContent'].forEach(x=>$(x).value=d.id);$('contentResult').textContent=JSON.stringify(d,null,2)}catch(e){$('contentResult').textContent=e}}
async function generate(){try{$('aiResult').textContent=JSON.stringify(await req(`/api/content/${$('contentId').value}/generate?platform=${$('platform').value}`,{method:'POST'}),null,2)}catch(e){$('aiResult').textContent=e}}
async function translateText(){try{const d=await req(`/api/content/${$('translateId').value}/translate?target=${$('lang').value}`,{method:'POST'});$('voiceText').value=d.translated_text;$('translationResult').textContent=JSON.stringify(d,null,2)}catch(e){$('translationResult').textContent=e}}
async function loadVoices(){try{const vs=await req('/api/voices');$('voice').innerHTML='<option value="">Default voice</option>'+vs.map(v=>`<option value="${v.voice_id}">${v.name} — ${v.gender}</option>`).join('')}catch(e){}}
async function makeVoice(){try{const d=await req('/api/voice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content_id:Number($('voiceContent').value),text:$('voiceText').value,voice_id:$('voice').value||null})});$('voiceResult').textContent=JSON.stringify(d,null,2)}catch(e){$('voiceResult').textContent=e}}
async function render(){try{const d=await req(`/api/content/${$('renderContent').value}/render`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content_id:Number($('renderContent').value),use_voiceover:true,burn_subtitles:$('burn').value==='true'})});$('renderResult').textContent=JSON.stringify(d,null,2)}catch(e){$('renderResult').textContent=e}}
async function schedule(){try{const d=await req('/api/schedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content_id:Number($('scheduleContent').value),platform:$('schedulePlatform').value,publish_at:new Date($('scheduleTime').value).toISOString(),max_attempts:Number($('attempts').value)||3})});$('scheduleResult').textContent=JSON.stringify(d,null,2);loadJobs()}catch(e){$('scheduleResult').textContent=e}}
async function loadJobs(){try{const js=await req('/api/jobs');$('jobs').innerHTML=js.map(j=>`<div class="job"><b>#${j.id} ${j.platform}</b> — ${j.status}<br>Publish: ${j.publish_at}<br>Attempts: ${j.attempts}/${j.max_attempts}<br>${j.error?`Error: ${j.error}<br>`:''}<button onclick="retryJob(${j.id})">Retry now</button></div>`).join('')}catch(e){$('jobs').textContent=e}}
async function retryJob(id){try{await req(`/api/jobs/${id}/retry`,{method:'POST'});loadJobs()}catch(e){alert(e)}}
loadVoices();loadJobs();
</script></main></body></html>
